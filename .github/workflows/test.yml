name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install flake8
      run: pip install flake8
    - name: flake8 (plugin code, .flake8 config)
      run: python -m flake8 --extend-exclude=tests,scripts,website,docs --count

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v -o "addopts="

  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp>=1.22,<2", "mcp>=2,<3"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install API and test dependencies
      run: python -m pip install -r requirements-test-api.txt '${{ matrix.mcp }}'
    - name: Check optional dependencies are importable
      run: python -c "import fastapi, httpx, mcp"
    - name: REST and MCP contract tests
      run: python -m pytest tests/api tests/unit/api -v -o "addopts="
